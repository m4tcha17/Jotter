plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.jottercamera'
version = '0.1.0'

android {
  namespace "expo.modules.jottercamera"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Pinned to 1.5.3 — the last stable release before 1.6.0's CameraPipe migration
  // (CXCP/CameraGraph in logcat), which introduces its own device-specific camera-priority
  // quirks. Keeps every API this module uses (Camera2Interop, awaitInstance).
  def camerax_version = "1.5.3"

  implementation "androidx.camera:camera-core:${camerax_version}"
  implementation "androidx.camera:camera-camera2:${camerax_version}"
  implementation "androidx.camera:camera-lifecycle:${camerax_version}"
  implementation "androidx.camera:camera-view:${camerax_version}"
  // findViewTreeLifecycleOwner() (the View extension) lives in this KTX artifact — nothing
  // else on this module's classpath transitively supplies it with camera-view:1.5.3.
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
  // Camera2CameraControl.setCaptureRequestOptions() returns a ListenableFuture. Something
  // elsewhere in the app forces com.google.guava:listenablefuture to Google's empty stub
  // (standard practice to avoid a duplicate-class clash with full Guava) — but nothing else
  // on this module's classpath supplies the real class, so it needs full Guava declared
  // directly for the type to resolve at compile time.
  implementation "com.google.guava:guava:33.3.1-android"
}
